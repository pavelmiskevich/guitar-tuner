name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Токену достаточно читать репозиторий: выкладка идёт по SSH, а не через GitHub.
permissions:
  contents: read

jobs:
  check:
    name: Тесты, линтер, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон проверок.
    # Группа задана на задаче, а не на всём workflow: иначе новый пуш обрывал бы
    # и уже начатую выкладку.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Набор браузеров определяется версией Playwright, а не всем lock-файлом:
      # иначе обновление любой зависимости заново качало бы сотни мегабайт.
      - name: Версия Playwright
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox-webkit

      # Firefox и WebKit гоняют спеки интерфейса без микрофона (#15): WebKit —
      # ближайшее к Safari на iOS, под который в коде есть отдельные ветки.
      - name: Установка браузеров
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # При попадании в кэш сам браузер уже есть, но системные библиотеки —
      # нет: они живут вне кэшируемого каталога. Chromium обходится тем, что
      # стоит в образе ubuntu-latest, а WebKit без своих библиотек не
      # запускается вовсе.
      #
      # apt на раннере бывает медленным или зависает. Раньше шаг ограничивался
      # пятью минутами и не считался фатальным — и при медленном зеркале WebKit
      # падал на всех 68 тестах с невнятным «browser has been closed». Теперь
      # две попытки по шесть минут, а неудача роняет шаг с понятной причиной.
      - name: Системные зависимости браузеров
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2; do
            if timeout 360 npx playwright install-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::установка системных библиотек браузеров, попытка $attempt не удалась"
          done
          echo "::error::не удалось поставить системные библиотеки браузеров — WebKit без них не запустится"
          exit 1

      - name: Проверка типов тестов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      # Пороги покрытия заданы в vite.config.ts: просевшее покрытие роняет шаг.
      - name: Модульные тесты и покрытие
        run: npm run test:coverage

      # QR-код для карточки доната в репозитории не хранится (см. .gitignore),
      # поэтому в сборку на раннере он попадает из секрета. Без секрета шаг
      # пропускается, и карточка показывает запасной значок — так же, как в
      # любой сборке из чистого клона.
      - name: QR-код доната из секрета
        env:
          DONATE_QR_PNG_BASE64: ${{ secrets.DONATE_QR_PNG_BASE64 }}
        run: |
          if [ -n "$DONATE_QR_PNG_BASE64" ]; then
            printf '%s' "$DONATE_QR_PNG_BASE64" | base64 --decode > public/qrCode.png
            echo "QR-код добавлен в сборку"
          else
            echo "Секрет DONATE_QR_PNG_BASE64 не задан — сборка без QR-кода"
          fi

      - name: Сборка
        run: npm run build

      # Поднимает production-сборку на порту 4173 и гоняет все проекты:
      # Chromium (десктоп, мобильный, реальный захват микрофона из WAV),
      # Firefox и WebKit (интерфейс без микрофона).
      - name: E2E-тесты
        run: npm run test:e2e

      # На сервер уезжает ровно та сборка, которую только что проверили E2E,
      # а не собранная заново в задаче выкладки.
      - name: Сохранение сборки для выкладки
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Выкладка
    needs: check
    # Только main и только после зелёных проверок; pull request сюда не попадает.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Секреты сервера лежат в окружении, а не в репозитории: окружение
    # разрешает выкладку только из main.
    environment:
      name: production
      url: https://guitar-tuner.miskevich.ru

    # Выкладки идут строго по очереди и не прерываются на середине.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # Оба домена отдают один и тот же каталог на одном сервере, поэтому
      # выкладка одна, а проверяются после неё оба адреса.
      SITES: guitar-tuner.miskevich.ru ic-albatross.com
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      # Окружение без секретов — сайт ещё не подключён. Это не ошибка: задача
      # завершается предупреждением, а не красным прогоном на каждом пуше.
      - name: Проверка настроек окружения
        id: config
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Выкладка пропущена::В окружении «production» не заданы секреты:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Путь подставляется в команду на сервере — только предсказуемые символы.
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::DEPLOY_PATH должен быть абсолютным путём из латинских букв, цифр и символов . _ - /"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          sparse-checkout: scripts/deploy

      - name: Загрузка проверенной сборки
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Ключ сервера берётся из секрета, а не принимается при первом
      # подключении: иначе раннер доверился бы любому хосту, ответившему
      # по этому адресу.
      - name: Настройка SSH
        if: steps.config.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Выкладка
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          release="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)

          test -s dist/index.html
          tar -czf dist.tar.gz -C dist .

          sha="$(sha256sum dist.tar.gz | cut -d' ' -f1)"

          # Архив кладётся не в общий /tmp под предсказуемым именем, а в
          # одноразовый каталог с правами 0700: на сервере его распаковывают
          # с повышенными правами, и подменить файл не должен иметь возможности
          # никто, кроме пользователя выкладки. Контрольная сумма сверяется
          # перед распаковкой.
          remote_dir="$(ssh "${ssh_opts[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'umask 077 && d="$(mktemp -d)" && cat > "$d/dist.tar.gz" && printf %s "$d"' < dist.tar.gz)"
          if ! printf '%s' "$remote_dir" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::сервер вернул неожиданный путь временного каталога"
            exit 1
          fi

          ssh "${ssh_opts[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$remote_dir/dist.tar.gz' '$release' 5 '$sha'" < scripts/deploy/remote-release.sh

          echo "Выпуск \`$release\` выложен" >> "$GITHUB_STEP_SUMMARY"

      # Каждый сайт должен отдавать именно тот бандл, который только что собран:
      # код 200 сам по себе ничего не говорит о том, какая сборка за ним стоит.
      # Проверяются все адреса, даже если один уже не прошёл, — чтобы в отчёте
      # было видно состояние каждого.
      - name: Проверка сайтов
        if: steps.config.outputs.ready == 'true'
        run: |
          set -uo pipefail
          expected="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -n 1)"
          if [ -z "$expected" ]; then
            echo "::error::в сборке не найден бандл"
            exit 1
          fi

          check_site() {
            local site="$1" actual=""
            for attempt in 1 2 3 4 5; do
              actual="$(curl -fsS --max-time 20 "https://$site/" | grep -o 'assets/index-[^"]*\.js' | head -n 1 || true)"
              if [ "$actual" = "$expected" ]; then
                curl -fsS --max-time 20 -o /dev/null "https://$site/$expected" || return 1
                curl -fsS --max-time 20 -o /dev/null "https://$site/fonts/manrope-cyrillic.woff2" || return 1
                return 0
              fi
              echo "$site, попытка $attempt: на сайте «$actual», ожидается «$expected»"
              sleep 5
            done
            return 1
          }

          failed=0
          for site in $SITES; do
            if check_site "$site"; then
              echo "✅ https://$site отдаёт $expected" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::https://$site не отдаёт новую сборку ($expected)"
              echo "❌ https://$site не отдаёт новую сборку" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
