name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Токену достаточно читать репозиторий: выкладка идёт по SSH, а не через GitHub.
permissions:
  contents: read

jobs:
  check:
    name: Тесты, линтер, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон проверок.
    # Группа задана на задаче, а не на всём workflow: иначе новый пуш обрывал бы
    # и уже начатую выкладку.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Браузер кэшируется по версии Playwright из lock-файла: пока версия
      # не менялась, повторная загрузка ~130 МБ не нужна.
      - name: Кэш браузера Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # При попадании в кэш сам браузер уже есть, но системные библиотеки —
      # нет: они живут вне кэшируемого каталога.
      #
      # Шаг вспомогательный: в образе ubuntu-latest нужные библиотеки, как
      # правило, уже стоят, а apt на раннере периодически зависает намертво и
      # съедает весь 20-минутный лимит задачи — прогон отменялся, ничего не
      # проверив. Поэтому ограничиваем шаг по времени и не считаем его падение
      # фатальным: реальную нехватку библиотек всё равно поймает шаг E2E,
      # который без них просто не запустит браузер.
      - name: Системные зависимости браузера
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium

      - name: Проверка типов тестов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Модульные тесты
        run: npm test

      # QR-код для карточки доната в репозитории не хранится (см. .gitignore),
      # поэтому в сборку на раннере он попадает из секрета. Без секрета шаг
      # пропускается, и карточка показывает запасной значок — так же, как в
      # любой сборке из чистого клона.
      - name: QR-код доната из секрета
        env:
          DONATE_QR_PNG_BASE64: ${{ secrets.DONATE_QR_PNG_BASE64 }}
        run: |
          if [ -n "$DONATE_QR_PNG_BASE64" ]; then
            printf '%s' "$DONATE_QR_PNG_BASE64" | base64 --decode > public/qrCode.png
            echo "QR-код добавлен в сборку"
          else
            echo "Секрет DONATE_QR_PNG_BASE64 не задан — сборка без QR-кода"
          fi

      - name: Сборка
        run: npm run build

      # Поднимает production-сборку на порту 4173 и гоняет все три проекта:
      # десктоп, мобильный и реальный захват микрофона из WAV.
      - name: E2E-тесты
        run: npm run test:e2e

      # На сервер уезжает ровно та сборка, которую только что проверили E2E,
      # а не собранная заново в задаче выкладки.
      - name: Сохранение сборки для выкладки
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Выкладка на ${{ matrix.site }}
    needs: check
    # Только main и только после зелёных проверок; pull request сюда не попадает.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Сайты независимы: сбой одного не должен отменять выкладку на другой.
      fail-fast: false
      matrix:
        site:
          - ic-albatross.com
          - guitar-tuner.miskevich.ru

    # У каждого сайта своё окружение GitHub со своим набором секретов, поэтому
    # сайты могут жить как на одном сервере, так и на разных.
    environment:
      name: ${{ matrix.site }}
      url: https://${{ matrix.site }}

    # Выкладки на один сайт идут строго по очереди и не прерываются на середине.
    concurrency:
      group: deploy-${{ matrix.site }}
      cancel-in-progress: false

    env:
      SITE: ${{ matrix.site }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      # Окружение без секретов — сайт ещё не подключён. Это не ошибка: задача
      # завершается предупреждением, а не красным прогоном на каждом пуше.
      - name: Проверка настроек окружения
        id: config
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Выкладка на $SITE пропущена::В окружении «$SITE» не заданы секреты:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Путь подставляется в команду на сервере — только предсказуемые символы.
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::DEPLOY_PATH должен быть абсолютным путём из латинских букв, цифр и символов . _ - /"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          sparse-checkout: scripts/deploy

      - name: Загрузка проверенной сборки
        if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Ключ сервера берётся из секрета, а не принимается при первом
      # подключении: иначе раннер доверился бы любому хосту, ответившему
      # по этому адресу.
      - name: Настройка SSH
        if: steps.config.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Выкладка
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          release="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          archive="/tmp/guitar-tuner-${release}.tar.gz"
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)

          test -s dist/index.html
          tar -czf dist.tar.gz -C dist .

          scp "${ssh_opts[@]}" -P "$port" dist.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          ssh "${ssh_opts[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$archive' '$release' 5" < scripts/deploy/remote-release.sh

          echo "Выпуск \`$release\` выложен на $SITE" >> "$GITHUB_STEP_SUMMARY"

      # Сайт должен отдавать именно тот бандл, который только что собран:
      # код 200 сам по себе ничего не говорит о том, какая сборка за ним стоит.
      - name: Проверка сайта
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          expected="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -n 1)"
          test -n "$expected"
          for attempt in 1 2 3 4 5; do
            actual="$(curl -fsS --max-time 20 "https://$SITE/" | grep -o 'assets/index-[^"]*\.js' | head -n 1 || true)"
            if [ "$actual" = "$expected" ]; then
              curl -fsS --max-time 20 -o /dev/null "https://$SITE/$expected"
              curl -fsS --max-time 20 -o /dev/null "https://$SITE/fonts/manrope-cyrillic.woff2"
              echo "https://$SITE отдаёт $expected"
              exit 0
            fi
            echo "попытка $attempt: на сайте «$actual», ожидается «$expected»"
            sleep 5
          done
          echo "::error::https://$SITE не отдаёт новую сборку ($expected)"
          exit 1

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/deploy_key
