name: probe-audio

on:
  workflow_dispatch:
  push:
    branches: [ci/probe-audio]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Проверка Web Audio в headless Chromium
        run: npx playwright test tests/e2e/fixtures/fake-mic.spec.ts --reporter=list
      - name: Артефакты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-traces
          path: test-results/
          retention-days: 5
